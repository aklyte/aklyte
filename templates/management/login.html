<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Login — AKLYTE</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/css/management.css" rel="stylesheet"></head><body class="login-page"><form method="post" class="login-card">{% csrf_token %}<div class="login-brand">AKLYTE<span>MANAGEMENT</span></div><h1>Staff sign in</h1><p>Sign in to manage your software catalogue.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<label class="form-label">Username</label><input class="form-control mb-3" name="username" autocomplete="username" required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" autocomplete="current-password" required><button class="btn btn-primary w-100">Sign in</button><a href="/" class="back-link">Back to storefront</a></form></body></html>
