{% extends "accounts/base.html" %}{% block account_heading %}Review {{ item.product_name }}{% endblock %}{% block account_content %}
<form method="post" class="card card-body">{% csrf_token %}<label class="form-label">Rating</label><select class="form-select mb-3" name="rating" required><option value="">Choose rating</option>{% for n in "12345" %}<option value="{{ n }}">{{ n }} / 5</option>{% endfor %}</select><label class="form-label">Title (optional)</label><input class="form-control mb-3" name="title" maxlength="120"><label class="form-label">Your review</label><textarea class="form-control mb-3" name="body" rows="5" maxlength="2000" required></textarea><button class="btn btn-primary">Submit review</button></form>
{% endblock %}
