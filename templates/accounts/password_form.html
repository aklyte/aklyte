{% extends "accounts/base.html" %}

{% block title %}Password — AKLYTE{% endblock %}

{% block account_heading %}
Password
{% endblock %}

{% block account_content %}

<style>
    .password-wrapper {
        max-width: 480px;
        margin: 20px auto;
        padding: 28px;
        background: #ffffff;
        border: 1px solid #dce6f5;
        border-radius: 14px;
    }

    .password-wrapper h2 {
        color: #0b1f3a;
        font-size: 25px;
        font-weight: 800;
        margin-bottom: 8px;
    }

    .password-description {
        color: #718096;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .password-wrapper p {
        margin-bottom: 18px;
    }

    .password-wrapper label {
        display: block;
        color: #0b1f3a;
        font-weight: 700;
        margin-bottom: 7px;
    }

    .password-wrapper input {
        width: 100%;
        min-height: 45px;
        padding: 10px 12px;
        border: 1px solid #d7e2f0;
        border-radius: 8px;
        outline: none;
        transition: 0.2s ease;
    }

    .password-wrapper input:focus {
        border-color: #1769e0;
        box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.12);
    }

    .password-wrapper .helptext {
        display: block;
        color: #718096;
        font-size: 12px;
        margin-top: 6px;
    }

    .password-wrapper ul {
        color: #718096;
        font-size: 12px;
        padding-left: 20px;
        margin-top: 8px;
    }

    .password-wrapper .errorlist {
        color: #dc2626;
        font-size: 13px;
        margin-top: 6px;
    }

    .password-submit-btn {
        width: 100%;
        min-height: 46px;
        background: #1769e0;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        margin-top: 8px;
        transition: 0.2s ease;
    }

    .password-submit-btn:hover {
        background: #1055bd;
    }

    @media (max-width: 576px) {
        .password-wrapper {
            padding: 20px;
        }
    }
</style>

<div class="password-wrapper">

    <h2>Set Your Password</h2>

    <p class="password-description">
        Enter your password details below to continue securely.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="password-submit-btn">
            Continue
        </button>
    </form>

</div>

{% endblock %}
