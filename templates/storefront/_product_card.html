
<style>
    .product-card {
        background: #ffffff;
        border: 1px solid #e7edf5;
        border-radius: 14px;
        overflow: hidden;
        transition: all .3s ease;
        display: flex;
        flex-direction: column;
    }

    .product-card:hover {
        transform: translateY(-6px);
        border-color: #b9d3ff;
        box-shadow: 0 15px 35px rgba(20, 65, 130, .12);
    }

    .product-image {
        display: block;
        height: 205px;
        background: #f1f5fb;
        overflow: hidden;
    }

    .product-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform .4s ease;
    }

    .product-card:hover .product-image img {
        transform: scale(1.06);
    }

    .image-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0b1d3a, #1b4c91);
        color: #ffffff;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 3px;
    }

    .product-card-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .product-category {
        display: inline-block;
        color: #2878ff;
        background: #edf4ff;
        border-radius: 5px;
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .5px;
        margin-bottom: 12px;
        width: fit-content;
    }

    .product-title {
        color: #142440;
        font-size: 17px;
        font-weight: 750;
        line-height: 1.4;
        text-decoration: none;
    }

    .product-title:hover {
        color: #2878ff;
    }

    .product-description {
        color: #718096;
        font-size: 13px;
        line-height: 1.7;
        margin-top: 10px;
        margin-bottom: 20px;
        flex: 1;
    }

    .product-card-actions {
        margin-top: auto;
    }

    .product-view-btn {
        display: block;
        width: 100%;
        text-align: center;
        padding: 11px 15px;
        border: 1px solid #2878ff;
        border-radius: 7px;
        color: #2878ff;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        transition: all .25s ease;
    }

    .product-view-btn:hover {
        background: #2878ff;
        color: #ffffff;
    }
</style>


<div class="col-sm-6 col-lg-3">

    <article class="product-card h-100">

        <a href="{{ product.get_absolute_url }}" class="product-image">

            {% if product.thumbnail %}
                <img src="{{ product.thumbnail.url }}"
                     alt="{{ product.name }}"
                     loading="lazy">
            {% else %}
                <div class="image-placeholder">
                    AKLYTE
                </div>
            {% endif %}

        </a>

        <div class="product-card-body">

            <span class="product-category">
                {{ product.category.name }}
            </span>

            <h3 class="h6 mb-0">
                <a class="product-title"
                   href="{{ product.get_absolute_url }}">
                    {{ product.name }}
                </a>
            </h3>

            <p class="product-description">
                {{ product.short_description|truncatechars:95 }}
            </p>

            <div class="product-card-actions">
                <a class="product-view-btn"
                   href="{{ product.get_absolute_url }}">
                    View Details →
                </a>
            </div>

        </div>

    </article>

</div>
